[project]
name = "students-projects-assigner"
version = "0.1.0"
description = "Assigns students to project topics based on ranked preferences."
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "openpyxl",   # reads raw .xlsx exports (convert_topics.py / convert_prefs.py)
]

[project.scripts]
# Primary workflow - run in order:
process-data = "process_data:main"              # stage 1: raw -> processed (stops for review)
finalize-assignment = "finalize_assignment:main" # stage 2: processed -> final
verify-assignment = "verify_assignment:main"     # stage 3: reconcile final output against raw sources
export-assignment = "export_assignment:main"     # stage 4: copy final results to Mini-Project/Assigned-Topics

# Individual steps, for advanced/manual use (process-data runs these for you):
convert-topics = "convert_topics:main"
convert-prefs = "convert_prefs:main"
resolve-unmatched-choices = "resolve_unmatched_choices:main"
find-duplicate-submissions = "find_duplicate_submissions:main"
run-assigner = "assigner:main"
annotate-assignment = "annotate_assignment:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "paths",
    "assigner",
    "convert_topics",
    "convert_prefs",
    "resolve_unmatched_choices",
    "annotate_assignment",
    "find_duplicate_submissions",
    "process_data",
    "finalize_assignment",
    "verify_assignment",
    "export_assignment",
]

[tool.setuptools.package-dir]
# all installable logic (including the stage orchestrators) lives in src/;
# scripts/ holds thin launcher stubs for running without installing, not
# part of the installed package itself
"" = "src"
